<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bluflix — Film</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="brand">🎬 <span class="brand-name">Bluflix</span></div>
    <a href="index.html" class="nav-link">← Wróć</a>
  </header>

  <main style="padding:24px;max-width:1100px;margin:0 auto;">
    <section id="details">
      <div id="player-container" style="margin-bottom:18px;border-radius:12px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,0.6)"></div>
      <h1 id="title"></h1>
      <p id="description" style="color:var(--muted)"></p>
    </section>
  </main>

  <script>
    const movies = {
      1: { yt: 'B2qxIb96rvQ', title: 'Film 1', desc: 'Opis filmu 1' },
      2: { yt: 'H1Tfu59UHH4', title: 'Film 2', desc: 'Opis filmu 2' }
    };
    const id = new URLSearchParams(window.location.search).get('id');
    const meta = movies[id];
    if(meta){
      document.getElementById('player-container').innerHTML = `<iframe width="100%" height="560" src="https://www.youtube.com/embed/${meta.yt}" frameborder="0" allowfullscreen></iframe>`;
      document.getElementById('title').innerText = meta.title;
      document.getElementById('description').innerText = meta.desc;
    } else {
      document.getElementById('player-container').innerHTML = '<p>Nie znaleziono filmu.</p>';
    }
  </script>
</body>
</html>
